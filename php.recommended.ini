; =====================================================================
; session-verify: 記事「あるべき設定」の実ファイル
;
; 使い方:
;   SESSION_VERIFY_PIN=0 php -c php.recommended.ini -S 127.0.0.1:8811 -t public
;
;   SESSION_VERIFY_PIN=0 が要る理由:
;   public/bootstrap.php は「どの環境でも観察1〜5が同じ結果になる」ように
;   セッション設定をピン留めしている（use_strict_mode = 0 など）。この
;   ファイルの設定を実際に効かせたいときは、そのピン留めを外す必要がある。
;
; 注意: session.cookie_secure = 1 は HTTPS 前提。ローカルのHTTP検証では
;       下のコメントのとおり 0 に変更すること（1 のままだとクッキーが
;       送られず、観察が成立しない）。
; =====================================================================

; --- セッションID の受け入れ方 ------------------------------------
; 未初期化のセッションIDを拒否する（セッションアダプション対策）。
; PHPのデフォルトは 0。全サイトで 1 が推奨。
session.use_strict_mode = 1

; IDはクッキーのみで扱い、URLには載せない
session.use_only_cookies = 1
session.use_trans_sid    = 0

; --- クッキー属性 --------------------------------------------------
session.cookie_httponly = 1
session.cookie_secure   = 1        ; HTTPS前提（ローカルHTTP検証時のみ 0）
session.cookie_samesite = "Lax"    ; CSRF緩和。要件により Strict / None

; --- この検証環境向けの土台 ----------------------------------------
; 保存先をプロジェクト直下の var/ に固定（run.sh が「サーバー層」として覗く）。
; 実務では既定の /tmp ではなく、権限を絞った専用ディレクトリや Redis / DB を使う。
session.save_path = "./var"
session.name      = PHPSESSID

; 観察の途中でGCに消されないようにする（検証用。本番では既定のままでよい）
session.gc_probability   = 0
session.gc_divisor       = 1000
session.gc_maxlifetime   = 1440
